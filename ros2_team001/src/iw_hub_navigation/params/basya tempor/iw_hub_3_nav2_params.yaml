amcl:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "iw_hub_3/base_link"
    global_frame_id: "map"
    odom_frame_id: "iw_hub_3/odom"
    scan_topic: "/iw_hub_3/scan_merged_1"
    map_topic: "/map"
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 6.0
      z: 0.0
      yaw: 0.0
    max_particles: 2000
    min_particles: 500
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true
    transform_tolerance: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: "map"
    robot_base_frame: "iw_hub_3/base_link"
    odom_topic: "/chassis/odom_iw_3"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: ["stopped_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0
    stopped_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5
      stateful: True
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      transform_tolerance: 2.0
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.8
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 1.8
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 60.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0        # FIX: was 5.0 -- too slow for 1.8m/s robot
      publish_frequency: 10.0       # FIX: was 2.0 -- DWB was reading 500ms stale costmap
      transform_tolerance: 2.0
      always_send_full_costmap: True
      global_frame: "iw_hub_3/odom"
      robot_base_frame: "iw_hub_3/base_link"
      use_sim_time: True
      rolling_window: True
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[ [0.3225, 0.3205], [0.3225, -0.3205], [-1.1175, -0.3205], [-1.1175, 0.3205] ]"
      footprint_padding: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 0.3
        inflation_radius: 7.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: "/iw_hub_3/scan_merged_1"
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
          obstacle_max_range: 10.0
          obstacle_min_range: 0.12
          observation_persistence: 1.0   # FIX: was missing (defaulted to 0) -- other AMR vanished between scan cycles
          expected_update_rate: 15.0     # FIX: warn if scan stops arriving

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0         # FIX: was 1.0 -- global costmap too stale for planner
      publish_frequency: 2.0        # FIX: was 1.0
      transform_tolerance: 2.0
      always_send_full_costmap: True
      global_frame: "map"
      robot_base_frame: "iw_hub_3/base_link"
      use_sim_time: True
      resolution: 0.05
      footprint: "[ [0.3225, 0.3205], [0.3225, -0.3205], [-1.1175, -0.3205], [-1.1175, 0.3205] ]"
      footprint_padding: 0.25
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 0.3
        inflation_radius: 1.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: "/iw_hub_3/scan_merged_1"
          data_type: "LaserScan"
          clearing: True
          marking: True
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
          obstacle_max_range: 10.0
          obstacle_min_range: 0.12
          observation_persistence: 1.0   # FIX: same as local
          expected_update_rate: 15.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: "iw_hub_3/odom"
    robot_base_frame: "iw_hub_3/base_link"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    odom_topic: "/chassis/odom_iw_3"

waypoint_follower:
  ros__parameters:
    use_sim_time: True
