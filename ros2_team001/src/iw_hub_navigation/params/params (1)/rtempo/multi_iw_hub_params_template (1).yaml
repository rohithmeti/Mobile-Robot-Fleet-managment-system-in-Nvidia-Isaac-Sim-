amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "iw_hub_[N]/base_link"
    global_frame_id: "map"
    odom_frame_id: "iw_hub_[N]/odom"
    scan_topic: "/iw_hub_[N]/scan_merged_[N]"
    map_topic: "/map"
    set_initial_pose: true
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    initial_pose:
      x: [START_X]
      y: [START_Y]
      z: 0.0
      yaw: [START_YAW]

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: "map"
    robot_base_frame: "iw_hub_[N]/base_link"
    odom_topic: "/chassis/odom_iw_[N]"
    bt_loop_duration: 20
    default_server_timeout: 40

velocity_smoother: 
  ros__parameters: 
    smoothing_frequency: 20.0 
    scale_velocities: false 
    feedback: "OPEN_LOOP" 
    max_velocity: [1.8, 0.0, 1.2] 
    min_velocity: [-1.8, 0.0, -1.2] 
    odom_topic: "/chassis/odom_iw_[N]" 
    odom_duration: 0.1

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: ["stopped_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    stopped_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: "iw_hub_[N]/odom"
      robot_base_frame: "iw_hub_[N]/base_link"
      use_sim_time: True
      rolling_window: True
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[ [0.3225, 0.3205], [0.3225, -0.3205], [-1.1175, -0.3205], [-1.1175, 0.3205] ]"
      plugins: ["front_rplidar_obstacle_layer", "back_rplidar_obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 0.3
        inflation_radius: 1.0
      front_rplidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: "/front_2d_lidar_iw_[N]"
          data_type: "LaserScan"
          clearing: True
          marking: True
      back_rplidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: "/back_2d_lidar_iw_[N]"
          data_type: "LaserScan"
          clearing: True
          marking: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "iw_hub_[N]/base_link"
      use_sim_time: True
      footprint: "[ [0.3225, 0.3205], [0.3225, -0.3205], [-1.1175, -0.3205], [-1.1175, 0.3205] ]"
      resolution: 0.05
      plugins: ["static_layer", "front_rplidar_obstacle_layer", "back_rplidar_obstacle_layer", "inflation_layer"]
      front_rplidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: "/front_2d_lidar_iw_[N]"
          data_type: "LaserScan"
          clearing: True
          marking: True
      back_rplidar_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: "/back_2d_lidar_iw_[N]"
          data_type: "LaserScan"
          clearing: True
          marking: True
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 0.3
        inflation_radius: 1.5
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5

behavior_server:
  ros__parameters:
    use_sim_time: True
    global_frame: "iw_hub_[N]/odom"
    robot_base_frame: "iw_hub_[N]/base_link"

waypoint_follower:
  ros__parameters:
    use_sim_time: True
