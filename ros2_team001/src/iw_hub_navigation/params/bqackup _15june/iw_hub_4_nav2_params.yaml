amcl:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "iw_hub_4/base_link"
    global_frame_id: "map"
    odom_frame_id: "iw_hub_4/odom"
    scan_topic: "/iw_hub_4/scan_merged_1" #"/front_2d_lidar_iw_4"
    map_topic: "/map"
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 9.0
      z: 0.0
      yaw: 0.0
    max_particles: 2000
    min_particles: 500
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true
    transform_tolerance: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: "map"
    robot_base_frame: "iw_hub_4/base_link"
    odom_topic: "/chassis/odom_iw_4"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: ["stopped_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 60.0
    stopped_goal_checker:
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.05       # FIX: was 0.25 (~14deg) -- now 0.05 rad (~3deg)
      stateful: True
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.4    # FIX: was missing -- triggers clean in-place rotation within ~23deg of goal
      rotate_to_heading_angular_vel: 0.5   # FIX: was missing -- controlled speed for final heading pivot
      max_angular_accel: 1.2         # FIX: was missing -- prevents angular overshoot
      transform_tolerance: 2.0
      debug_trajectory_details: True
      min_vel_x: -0.25
      min_vel_y: 0.0
      max_vel_x: 1.5
      max_vel_y: 0.0
      max_vel_theta: 0.8             # FIX: was 1.2 -- reduced for controlled final turn
      min_speed_xy: 0.0
      max_speed_xy: 1.8
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 60             # FIX: was 20 -- tripled for dense angular trajectory sampling
      sim_time: 2.0                  # FIX: was 1.7 -- longer horizon to properly score turning trajectories
      linear_granularity: 0.05
      angular_granularity: 0.01      # FIX: was 0.025 -- finer step = smoother angular scoring
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.05       # FIX: was 0.25 (~14deg) -- now ~3deg
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: False
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist","PreferForward"]
      BaseObstacle.scale: 10.0
      ScaleObstacle.scale: 1.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 32.0          # FIX: was 24.0 -- stronger pull toward goal heading direction
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 8.0   # FIX: was 5.0 -- starts braking earlier to nail the heading
      RotateToGoal.lookahead_time: -1.0
      PreferForward.scale : 5.0
      PreferFoward.penalty : 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      transform_tolerance: 2.0
      always_send_full_costmap: True
      global_frame: "iw_hub_4/odom"
      robot_base_frame: "iw_hub_4/base_link"
      use_sim_time: True
      rolling_window: True
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[ [0.3225, 0.3205], [0.3225, -0.3205], [-1.1175, -0.3205], [-1.1175, 0.3205] ]"
      footprint_padding: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 2.0
        inflation_radius: 1.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: "/iw_hub_4/scan_merged_1" #"/front_2d_lidar_iw_4"
          data_type: "LaserScan"
          sensor_frame: "iw_hub_4/base_link"
          clearing: True
          marking: True
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
          obstacle_max_range: 10.0
          obstacle_min_range: 0.12
          observation_persistence: 1.0   # FIX: was missing (defaulted to 0) -- other AMR vanished between scan cycles
          expected_update_rate: 15.0     # FIX: warn if scan stops arriving


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      transform_tolerance: 2.0
      always_send_full_costmap: True
      global_frame: "map"
      robot_base_frame: "iw_hub_4/base_link"
      use_sim_time: True
      resolution: 0.05
      footprint: "[ [0.3225, 0.3205], [0.3225, -0.3205], [-1.1175, -0.3205], [-1.1175, 0.3205] ]"
      footprint_padding: 0.2
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 0.3
        inflation_radius: 1.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: "/iw_hub_4/scan_merged_1" #"/front_2d_lidar_iw_4"
          data_type: "LaserScan"
          sensor_frame: "iw_hub_4/base_link"
          clearing: True
          marking: True
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
          obstacle_max_range: 10.0
          obstacle_min_range: 0.12
          observation_persistence: 1.0
          expected_update_rate: 15.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "my_warehouse_map.yaml"

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: "iw_hub_4/odom"
    robot_base_frame: "iw_hub_4/base_link"
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait", "spin", "backup"]
    wait:
      plugin: "nav2_behaviors/Wait"
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      backup_dist: 0.3      # how far back it goes (metres)
      backup_speed: 0.1

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    odom_topic: "/chassis/odom_iw_4"
    max_velocity: [1.5, 0.0, 0.8]     # FIX: added -- caps smoothed angular velocity to match max_vel_theta
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]

waypoint_follower:
  ros__parameters:
    use_sim_time: True
